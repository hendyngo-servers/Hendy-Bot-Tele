name: Deploy Cloudflare Worker and Pages

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "mini-app/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: \${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      VITE_API_BASE_URL: \${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "Missing repository variable CLOUDFLARE_D1_DATABASE_ID"; exit 1; }
          test -n "$VITE_API_BASE_URL" || { echo "Missing repository variable VITE_API_BASE_URL"; exit 1; }
          [[ "$VITE_API_BASE_URL" == https://* ]] || { echo "VITE_API_BASE_URL must use HTTPS"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bind the existing D1 database
        shell: bash
        run: |
          sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
          grep -q "database_id = \"$D1_DATABASE_ID\"" wrangler.toml

      - name: Ensure R2 buckets exist
        shell: bash
        run: |
          npx --yes wrangler@4 r2 bucket create hendy-bot-backups || true
          npx --yes wrangler@4 r2 bucket create hendy-bot-assets || true

      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply hendy-bot-db --remote

      - name: Deploy Cloudflare Worker
        run: npx --yes wrangler@4 deploy

      - name: Build Telegram Mini App for Pages
        run: npm run build

      - name: Create Pages project when missing
        run: npx --yes wrangler@4 pages project create hendy-bot-miniapp --production-branch main || true

      - name: Deploy Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy mini-app/dist --project-name hendy-bot-miniapp --branch main
