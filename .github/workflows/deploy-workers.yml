name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [backend-api, edge-router, self-healing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Deploy selected Worker
        run: npx wrangler deploy --config workers/$WORKER/wrangler.jsonc
        env:
          WORKER: ${{ matrix.worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
