name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-user, web-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build selected Pages app
        run: npm run build:$PAGES_BUILD
        env:
          PAGES_BUILD: ${{ matrix.app == 'web-user' && 'user' || 'admin' }}
      - name: Publish Pages project
        run: npx wrangler pages deploy apps/$PAGES_APP/dist --project-name hendy-$PAGES_APP
        env:
          PAGES_APP: ${{ matrix.app }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
