name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Cloudflare CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-user, web-admin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build selected Pages app
        run: npm run build:$PAGES_BUILD
        env:
          PAGES_BUILD: \${{ matrix.app == 'web-user' && 'user' || 'admin' }}
          VITE_API_BASE_URL: \${{ vars.VITE_API_BASE_URL }}
      - name: Publish Pages project
        run: npx wrangler pages deploy apps/$PAGES_APP/dist --project-name hendy-$PAGES_APP
        env:
          PAGES_APP: \${{ matrix.app }}
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
