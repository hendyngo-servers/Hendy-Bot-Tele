name: Cloudflare CI

on:
  push:
    branches: [main, "cloudflare-platform-v1", "feature/**", "fix/**"]
  pull_request:
    branches: [main, "cloudflare-platform-v1"]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript checks
        run: npm run typecheck
      - name: Apply D1 migrations to local database
        run: npm run db:local
      - name: Compile Workers without deploying
        run: npm run check:workers
      - name: Check migration and webhook scripts
        run: node --check scripts/import-json-to-d1.mjs && node --check scripts/verify-json-to-d1.mjs && node --check scripts/set-telegram-webhook.mjs
      - name: Unit tests
        run: npm test
      - name: Build both Pages projects
        run: npm run build
      - name: Verify build output
        run: test -s apps/web-user/dist/index.html && test -s apps/web-admin/dist/index.html
