name: Production CI

on:
  push:
    branches: [main, production/render-cloudflare-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Mini App
        run: npm run build
