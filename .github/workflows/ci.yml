name: Production CI

on:
  push:
    branches: [main, production/render-cloudflare-hardening, production/final-ops-2026-11-01]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate D1 migrations with SQLite
        run: |
          python - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          for migration in sorted(pathlib.Path("migrations").glob("*.sql")):
              db.executescript(migration.read_text(encoding="utf-8"))
              print(f"Applied {migration}")
          tables = db.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").fetchall()
          print(f"Validated {len(tables)} D1 tables")
          PY

      - name: Syntax checks
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Mini App
        run: npm run build
