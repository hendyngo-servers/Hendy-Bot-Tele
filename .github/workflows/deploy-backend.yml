name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/db-schema/**"
      - "packages/shared-types/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/db-schema/**"
      - "packages/shared-types/**"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hendy-bot-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Check Cloudflare deployment configuration
        id: deploy_config
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready=true
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then ready=false; fi
          if grep -Eq 'REPLACE_WITH_D1_DATABASE_ID|REPLACE_WITH_KV_NAMESPACE_ID' backend/wrangler.toml; then ready=false; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then echo "::warning::Worker deployment skipped: configure Cloudflare credentials, D1 ID and KV namespace ID first."; fi
      - name: Apply D1 migrations
        if: github.event_name != 'pull_request' && steps.deploy_config.outputs.ready == 'true'
        run: pnpm exec wrangler d1 migrations apply DB --remote --config backend/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: github.event_name != 'pull_request' && steps.deploy_config.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --config backend/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
