name = "hendy-bot-tele-edge"
main = "cloudflare/worker.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "hendy-bot-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "hendy-bot-backups"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "hendy-bot-assets"

[triggers]
crons = ["0 2 * * *"]

[vars]
ENVIRONMENT = "production"
D1_DATABASE_NAME = "hendy-bot-db"
RENDER_BACKEND_URL = "https://hendy-bot-tele.onrender.com"
