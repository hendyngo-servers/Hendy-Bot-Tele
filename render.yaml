services:
  - type: web
    name: hendy-bot-tele
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_MODE
        value: webhook
      - key: SET_WEBHOOK_ON_START
        value: "false"
      - key: TELEGRAM_AUTH_MAX_AGE_SECONDS
        value: "86400"
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: BASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_WEBAPP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: BACKUP_WORKER_URL
        sync: false
      - key: BACKUP_TRIGGER_SECRET
        sync: false
      - key: R2_UPLOAD_WORKER_URL
        sync: false
      - key: R2_UPLOAD_SECRET
        sync: false
      - key: VIETQR_BANK_ID
        sync: false
      - key: VIETQR_ACCOUNT_NO
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: GROUP_CHAT_URL
        sync: false
      - key: NEWS_CHANNEL_URL
        sync: false
      - key: SUPPORT_URL
        sync: false
