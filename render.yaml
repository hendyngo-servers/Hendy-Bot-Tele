services:
  - type: web
    name: hendy-bot-tele
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npm install --no-audit --no-fund && npm run check && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: hendy-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: hendy-bot-db
          property: connectionString
      - key: PGPOOL_MAX
        value: "5"
      - key: CLOUDFLARE_ACCOUNT_ID
        value: "918ff2f016938fc978ed23b96505b21e"
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: BANK_BIN
        sync: false
      - key: BANK_ACCOUNT
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_NAME
        sync: false
      - key: MIN_DEPOSIT_VND
        value: "10000"
      - key: SUPPORT_USERNAME
        sync: false

databases:
  - name: hendy-bot-db
    databaseName: hendy_bot
    user: hendy_bot
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "18"
    diskSizeGB: 1
    ipAllowList: []
