services:
  - type: web
    name: hendy-bot-tele
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: npm install && npm run check && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: hendy-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: BANK_BIN
        sync: false
      - key: BANK_ACCOUNT
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_NAME
        sync: false
      - key: MIN_DEPOSIT_VND
        value: "10000"
      - key: SUPPORT_USERNAME
        sync: false
