services:
  - type: web
    name: hendy-bot-tele
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # Render sẽ tự sinh URL (vd: https://hendy-bot.onrender.com) và gán vào đây
      - key: WEBHOOK_DOMAIN
        value: ${RENDER_EXTERNAL_URL}

      # Bạn tự tạo một chuỗi ngẫu nhiên (vd: secret_123_abc) để bảo mật webhook
      - key: WEBHOOK_SECRET_TOKEN
        sync: false 

      # Các biến này sẽ không lưu trong mã nguồn, Render sẽ hỏi bạn lúc deploy
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: CORE_BACKEND_URL
        sync: false
