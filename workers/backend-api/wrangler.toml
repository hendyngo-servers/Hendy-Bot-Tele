name = "hendy-backend-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hendy-production"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../packages/db-schema/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hendy-app-files"

[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://app.example.com,https://admin.example.com"
TELEGRAM_WEBAPP_URL = "https://app.example.com"
TELEGRAM_ADMIN_WEBAPP_URL = "https://admin.example.com"

[observability]
enabled = true
